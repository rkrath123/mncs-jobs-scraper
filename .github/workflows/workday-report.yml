name: Workday India jobs and publish

on:
  schedule:
    # twice a day: 11:00 IST and 20:00 IST (cron is UTC)
    - cron: "30 5 * * *"
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

# This scrape is slow (Workday rate-limits GitHub's IPs), so it must not block the other workflows
# and two Workday runs must not overlap (that would double the rate limiting).
concurrency:
  group: workday
  cancel-in-progress: false

env:
  TZ: Asia/Kolkata  # report times and "today" use IST

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 340  # GitHub's limit is 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install httpx

      # Posting-detail cache of earlier runs (the script reuses entries up to 14 days old). It is saved even when a
      # run fails or times out, so every run makes the next one faster.
      - name: Restore posting-detail cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/mncs-jobs-scraper
          key: workday-details-${{ github.run_id }}
          restore-keys: workday-details-

      - name: Run Workday scraper
        timeout-minutes: 300
        working-directory: ATS/workday-india-jobs
        run: python3 workday_india_jobs.py -k "sre,devops,kubernetes,mlops,aiops,fde,forward deployed engineer,ai engineer" --rate 5 --open

      - name: Save posting-detail cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/mncs-jobs-scraper
          key: workday-details-${{ github.run_id }}

      - name: Collect report
        run: |
          out=ATS/workday-india-jobs/output
          mkdir -p report
          cp "$(ls -t $out/*/workday_india_jobs_*.html | head -n 1)" report/workday_india_jobs.html
          cp "$(ls -t $out/*/workday_india_jobs_*.csv | head -n 1)" report/workday_india_jobs.csv

      - uses: actions/upload-artifact@v4
        with:
          name: workday-report
          path: report/
          retention-days: 1

  publish:
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same group as the other workflows: all of them publish to gh-pages, one at a time.
    concurrency:
      group: scrape
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: workday-report
          path: report

      # Cloned only now, so changes published by other workflows while the scrape ran are kept.
      - name: Restore current site
        run: |
          if git ls-remote --exit-code --heads "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
            rm -rf site/.git
          else
            mkdir site
          fi

      - name: Add report to site
        run: |
          day=$(date +%F)
          mkdir -p site/workday/reports/$day
          cp report/workday_india_jobs.html site/workday/index.html
          cp report/workday_india_jobs.html report/workday_india_jobs.csv site/workday/reports/$day/
          # keep the last 30 days
          ls -d site/workday/reports/*/ | sort | head -n -30 | xargs -r rm -rf
          {
            echo '<!doctype html><meta charset="utf-8"><title>Workday reports</title>'
            echo '<body style="font-family:sans-serif;max-width:640px;margin:2em auto"><h1>Workday reports</h1>'
            echo '<p><a href="../">Latest Workday report</a></p><ul>'
            for d in $(ls site/workday/reports | grep -v index.html | sort -r); do
              echo "<li><a href=\"$d/workday_india_jobs.html\">$d</a> (<a href=\"$d/workday_india_jobs.csv\">csv</a>)</li>"
            done
            echo '</ul></body>'
          } > site/workday/reports/index.html
          touch site/.nojekyll

      # Single commit, force-pushed, so the branch does not grow with every run.
      - name: Publish to gh-pages
        working-directory: site
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Workday report $(date +'%Y-%m-%d %H:%M %Z')"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
